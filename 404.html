<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    :root { --bg: #f6f6fa; --dot: #dcdce6; --ink: #16161d; --muted: #62627a; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0f14; --dot: #23242e; --ink: #ececf3; --muted: #9c9cb2; --accent: #8b8af8; }
    }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    p { margin: 0 0 12px; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: .85rem; color: var(--accent); }
    .fact { font-size: clamp(1.25rem, 3.8vw, 1.65rem); font-weight: 500; line-height: 1.35; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
